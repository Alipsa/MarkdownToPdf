<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- macOS Big Sur+ icons are drawn inset within their canvas so the
       rounded-square background doesn't touch the canvas edges — otherwise
       it renders visibly larger than sibling app icons in the Dock. 0.82
       matches this app's Dock tile against neighboring icons (nudged up
       slightly from Apple's nominal 824/1024 ≈ 0.8047 guideline). -->
  <g transform="translate(256,256) scale(0.82) translate(-256,-256)">

    <!-- Background: deep indigo, macOS-style rounded square -->
    <rect width="512" height="512" fill="#1a237e" rx="80"/>

    <!-- "M" drawn as a stroked skeleton path — no font required.
         stroke-linecap="square" extends each open end 20 px past the stated endpoint,
         so the actual rendered bars start at y=85 (top) and end at y=295 (bottom).
         Left bar:  x 51–91   Right bar:  x 271–311   V-tip: (181, 236)
         Shifted +10 right of the original 41/261/171 centering to balance its
         gap to the rounded square's left edge against the arrow's right gap. -->
    <path d="M 71,275 L 71,105 L 181,236 L 291,105 L 291,275"
          stroke="white" stroke-width="40"
          stroke-linecap="square" stroke-linejoin="miter"
          fill="none"/>

    <!-- Downward arrow  (centred at x=413, spanning y 85–308) -->
    <!-- stem -->
    <rect x="393" y="85" width="40" height="134" fill="white" rx="4"/>
    <!-- arrowhead -->
    <polygon points="354,219 472,219 413,308" fill="white"/>

    <!-- Thin accent line between the symbol and the "pdf" label -->
    <rect x="60" y="328" width="392" height="2" fill="#3f51b5" opacity="0.8"/>

    <!-- "pdf" — lowercase, bold, coral-red, bottom third -->
    <text x="256" y="442"
          text-anchor="middle"
          fill="#ef5350"
          font-family="Arial, 'Liberation Sans', sans-serif"
          font-weight="900"
          font-size="118">pdf</text>

  </g>

</svg>
